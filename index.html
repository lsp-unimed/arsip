<!-- Kelola Templat DIMATIKAN sementara (2026-10-10, atas permintaan Pak Boss): script kustom tidak dimuat, tombol + daftar kustom disembunyikan. File templatkustom.js + sheet TemplatKustom tetap ada, tinggal aktifkan lagi bila diminta. -->

<script>
(function () {
  'use strict';
  // Tanggal hari ini menurut WIB (otomatis, bukan tanggal tetap).
  const HARI_INI = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const tgl = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); return d + ' ' + BLN[m - 1] + ' ' + y; };
  const hari = (s) => Math.round((new Date(s) - new Date(HARI_INI)) / 86400000);
  const jam = () => HARI_INI + ' ' + new Date().toTimeString().slice(0, 5);
  const romawi = (n) => ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n - 1];
  const pad = (n) => String(n).padStart(3, '0');
  const PER = 10;
  const API_URL = 'https://script.google.com/macros/s/AKfycby9YSQGGju1QDabN1FrdZrRyQLkDMa4ILFF6xqDechI0Al_ts_3vLYnUcLOjWLn0Rye/exec';
  let SESI = null; // {token, username, nama, peran}
  // Alamat aplikasi lain (ganti di sini saat domain resmi tersedia).
  const URL_SIPINTAR = 'https://lsp-unimed.github.io/sipintar/', URL_SIPINTAR_ADMIN = 'https://lsp-unimed.github.io/sipintar/admin.html';
  let TERPUSAT = false; // true = akun dikelola di SIPINTAR (satu username + password)
  let CATATAN = ''; // teks aktivitas yang ikut terkirim bersama simpan berikutnya (tanpa panggilan Log terpisah)

  // Panggil backend (POST text/plain agar lolos CORS Apps Script).
  async function api(aksi, isi) {
    isi = isi || {};
    if (SESI && SESI.token) { isi.token = SESI.token; try { window.__tokenTerakhir = SESI.token; } catch (e) {} }
    if (CATATAN && ['tambah', 'ubah', 'hapus', 'batch'].includes(aksi) && !isi.catatan) { isi.catatan = CATATAN; CATATAN = ''; }
    let r;
    try {
      r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ aksi }, isi)) });
    } catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.'); }
    let j;
    try { j = JSON.parse(await r.text()); }
    catch (e) { throw new Error('Server belum siap (izin atau deployment Apps Script belum benar).'); }
    if (!j.ok) {
      if (/Sesi berakhir|login kembali/i.test(j.pesan || '')) { keluarLokal(); login('Sesi berakhir. Silakan masuk kembali.'); }
      throw new Error(j.pesan || 'Terjadi kesalahan.');
    }
    return j.data;
  }
  const simpanSesi = () => { try { (SESI && SESI.ingat ? localStorage : sessionStorage).setItem('arsip_sesi', JSON.stringify(SESI)); (SESI && SESI.ingat ? sessionStorage : localStorage).removeItem('arsip_sesi'); } catch (e) {} };
  const muatSesi = () => { try { return JSON.parse(localStorage.getItem('arsip_sesi') || sessionStorage.getItem('arsip_sesi') || 'null'); } catch (e) { return null; } };
  const keluarLokal = () => { hapusSnapshot(); SESI = null; try { localStorage.removeItem('arsip_sesi'); sessionStorage.removeItem('arsip_sesi'); } catch (e) {} };
  // Salinan data terakhir agar panel langsung tampil saat dibuka ulang (diperbarui dari server di belakang).
  const kunciSnap = () => 'arsip_snap_' + ((SESI && SESI.username) || '');
  const simpanSnapshot = (d) => { try { if (!SESI) return; (SESI.ingat ? localStorage : sessionStorage).setItem(kunciSnap(), JSON.stringify({ t: Date.now(), d })); } catch (e) { /* penyimpanan penuh: abaikan */ } };
  const bacaSnapshot = () => { try { const x = JSON.parse(localStorage.getItem(kunciSnap()) || sessionStorage.getItem(kunciSnap()) || 'null'); return x && x.d && Date.now() - x.t < 7 * 86400000 ? x.d : null; } catch (e) { return null; } };
  const hapusSnapshot = () => { try { [localStorage, sessionStorage].forEach(st => Object.keys(st).filter(k => k.indexOf('arsip_snap_') === 0).forEach(k => st.removeItem(k))); } catch (e) {} };

  /* ---------- Kategori & data contoh ---------- */
  const KAT = [
    ['LIS', 'Lisensi & legalitas', 'SK pendirian, SK pengurus, lisensi BNSP', 'Permanen'],
    ['MUT', 'Dokumen mutu', 'Panduan mutu, SOP, instruksi kerja, formulir', 'Selama berlaku + 5 tahun'],
    ['SKM', 'Skema & MUK', 'Dokumen skema dan materi uji kompetensi', 'Selama skema berlaku'],
    ['ASR', 'Asesor', 'Sertifikat asesor, SK dan surat tugas, perjanjian kerahasiaan', 'Selama aktif + 5 tahun'],
    ['TUK', 'Tempat uji', 'SK penetapan, verifikasi TUK, daftar peralatan', 'Selama aktif + 5 tahun'],
    ['ASM', 'Rekaman asesmen', 'Daftar hadir, berita acara, rekaman MUK per jadwal', '5 tahun'],
    ['MNJ', 'Rapat & manajemen', 'Undangan, daftar hadir, notulen, audit internal, kaji ulang', '5 tahun'],
    ['KOR', 'Surat-menyurat', 'Arsip surat keluar dan surat masuk', '5 tahun']
  ];
  const katNama = (k) => (KAT.find(x => x[0] === k) || [k, k])[1];
  const BAGIAN = ['Sekretariat', 'Administrasi', 'Bidang Sertifikasi', 'Manajemen Mutu', 'Bidang Skema'];

  /* ---------- Pedoman kode jenis (dipakai nomor manual + tab Pedoman) ---------- */
  // kode: [arti, contoh pakai, kategori yg cocok]
  const JENIS = [
    ['UND', 'Undangan', 'rapat, kegiatan, uji kompetensi', 'MNJ, KOR'],
    ['ST', 'Surat tugas', 'penugasan asesor / panitia / petugas', 'ASR, KOR'],
    ['SK', 'Keputusan', 'SK pengurus, SK asesor, SK TUK', 'LIS, ASR, TUK'],
    ['PB', 'Pemberitahuan', 'penyampaian info resmi ke BNSP / unit', 'KOR'],
    ['BA', 'Berita acara', 'verifikasi TUK, hasil asesmen', 'TUK, ASM'],
    ['DH', 'Daftar hadir', 'rapat, uji kompetensi', 'MNJ, ASM'],
    ['NOT', 'Notulen', 'hasil rapat, kaji ulang', 'MNJ'],
    ['SOP', 'Prosedur mutu', 'SOP pelayanan, banding, keluhan', 'MUT'],
    ['PM', 'Panduan mutu', 'panduan mutu LSP', 'MUT'],
    ['IK', 'Instruksi kerja', 'petunjuk teknis pelaksanaan', 'MUT'],
    ['FR', 'Formulir', 'FR.APL.01, FR.APL.02, dsb.', 'MUT, ASM'],
    ['MUK', 'Materi uji', 'materi uji kompetensi per skema', 'SKM'],
    ['SKM', 'Dokumen skema', 'skema okupasi / kualifikasi / klaster', 'SKM'],
    ['SERT', 'Sertifikat', 'sertifikat asesor / lisensi', 'LIS, ASR'],
    ['MOU', 'Kerja sama', 'MOU / PKS dengan mitra & TUK', 'LIS, KOR'],
    ['LAP', 'Laporan', 'audit internal, kaji ulang, monev', 'MNJ, MUT'],
    ['SM', 'Surat masuk', 'nomor agenda surat masuk (SM-###/tahun)', 'KOR']
  ];
  const jenisArti = (k) => ((JENIS.find(x => x[0] === k) || [])[1] || k);

  // Data contoh dikosongkan — dashboard mulai dari 0.
  const D = [];
  const seq = { SURAT: 0, SM: 0 };
  // Saran nomor manual: surat 075/... berikutnya; dokumen non-surat saran register, tetap bisa diketik ulang.
  const saranSurat = (kode, t) => { t = t || HARI_INI; return `${pad(seq.SURAT + 1)}/LSP-UNIMED/${kode}/${romawi(+t.slice(5, 7))}/${t.slice(0, 4)}`; };
  const nomorDipakai = (no) => DOCS.some(d => d.kode === no);
  let DOCS = D.map((d, i) => {
    const x = d[7] || {}, y = (d[3] || HARI_INI).slice(0, 4);
    if (!x.kode) seq[d[0]] = (seq[d[0]] || 0) + 1;
    return Object.assign({ id: i + 1, kode: x.kode || `LSP-UNIMED/${d[0]}/${pad(seq[d[0]])}/${y}`, kat: d[0], judul: d[1], pemilik: d[2], terbit: d[3], sampai: d[4], status: d[5], rev: d[6],
      berkas: d[1].replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf', file_id: x.file_id || '', file_url: x.file_url || '', riwayat: [] }, x.surat ? { surat: true, alur: x.alur } : {}, x.tpl ? { tpl: x.tpl } : {});
  });
  // --- Jembatan backend: petakan baris sheet -> bentuk tampilan, dan sebaliknya ---
  const tglId = (s) => { if (!s) return ''; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3]; const t = new Date(s); return isNaN(t) ? '' : t.toISOString().slice(0, 10); };
  const dokDariServer = (r) => {
    let tpl = null;
    try { tpl = r.tpl_data ? JSON.parse(r.tpl_data) : (r.tpl_id ? { id: r.tpl_id, data: {} } : null); } catch (e) { tpl = r.tpl_id ? { id: r.tpl_id, data: {} } : null; }
    if (tpl && tpl.id && !tpl.data) tpl = { id: tpl.id, data: tpl };
    const o = { _rid: r.id, id: r.id, kode: r.kode, kat: r.kat, judul: r.judul, pemilik: r.pemilik || '', terbit: tglId(r.terbit), sampai: tglId(r.sampai), status: r.status || 'Berlaku', arsip: String(r.arsip || '').toUpperCase() === 'YA' || r.arsip === true, rev: +(r.rev || 1), surat: String(r.surat || '').toUpperCase() === 'Y', alur: r.alur || '', berkas: r.file_nama || ((r.judul || 'berkas').replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf'), file_id: r.file_id || '', file_url: r.file_url || '', ket: r.ket || '', riwayat: [] };
    if (tpl) o.tpl = tpl;
    return o;
  };
  const dokKeServer = (d) => ({ kode: d.kode, kat: d.kat, judul: d.judul, pemilik: d.pemilik || '', terbit: d.terbit || '', sampai: d.sampai || '', status: d.status || 'Berlaku', arsip: d.arsip ? 'YA' : '', rev: d.rev || 1, alur: d.alur || '', surat: d.surat ? 'Y' : '', tpl_id: (d.tpl && d.tpl.id) || '', tpl_data: d.tpl ? JSON.stringify(d.tpl) : '', file_id: d.file_id || '', file_nama: d.berkas || '', file_url: d.file_url || '', ket: d.ket || '' });
  const smDariServer = (r, dispSemua) => ({ _rid: r.id, id: r.id, agenda: r.agenda, tglSurat: tglId(r.tgl_surat), terima: tglId(r.terima), asal: r.asal || '', nomor: r.nomor || '', perihal: r.perihal || '', sifat: r.sifat || 'Biasa', status: r.status || 'Diterima', arsip: String(r.arsip || '').toUpperCase() === 'YA' || r.arsip === true, berkas: r.file_nama || ('Pindaian_' + String(r.agenda || '').replace(/\W+/g, '_') + '.pdf'), file_id: r.file_id || '', file_url: r.file_url || '', disp: (dispSemua || []).filter(x => String(x.surat_id) === String(r.id)).map(x => ({ _rid: x.id, tgl: tglId(x.tgl), ke: String(x.ke || '').split(',').map(s => s.trim()).filter(Boolean), instruksi: x.instruksi || '', catatan: x.catatan || '', batas: tglId(x.batas) })) });
  // muatData: tarik Dokumen+Revisi+SuratMasuk+Disposisi+Agenda+Log dari backend sekali saat shell.
  let DATA_OK = false;
  async function muatKopDari(baris) {
    try {
      const b = baris || null;
      if (b) { if (b.id) { try { window.__kopId = b.id; } catch (e) {} } ['l1', 'l2', 'l3', 'l4', 'l5', 'kota', 'jabatan', 'nama', 'nip'].forEach(k => { if (b[k] != null && String(b[k]) !== '') window.KOP[k] = b[k]; }); }
    } catch (e) {}
  }
  async function muatKop() {
    try {
      const r = await api('list', { tabel: 'Kop', opsi: { per: 5 } });
      const b = (r && r.baris && r.baris[0]) || null;
      if (b) { if (b.id) { try { window.__kopId = b.id; } catch (e) {} } ['l1', 'l2', 'l3', 'l4', 'l5', 'kota', 'jabatan', 'nama', 'nip'].forEach(k => { if (b[k] != null && String(b[k]) !== '') window.KOP[k] = b[k]; }); }
    } catch (e) {}
  }
  function terapkanDasbor(d) {
    if ('terpusat' in d) TERPUSAT = !!d.terpusat;
    if (d.saya && SESI) { SESI.nama = d.saya.nama; SESI.peran = d.saya.peran; PERAN_AKTIF = d.saya.peran; simpanSesi(); }
    const dok = d.dok || [], rev = d.rev || [], sm = d.sm || [], disp = d.disp || [], ag = d.ag || [], agB = d.agB || [], lg = d.log || [];
    muatKopDari(d.kop);
    DOCS = dok.map(dokDariServer);
    const revBy = {};
    rev.forEach(x => { (revBy[x.dokumen_id] = revBy[x.dokumen_id] || []).push({ _rid: x.id, rev: +x.rev || 1, tanggal: tglId(x.tanggal), oleh: x.oleh || '', catatan: x.catatan || '', file_id: x.file_id || '', file_nama: x.file_nama || '', file_url: x.file_url || '' }); });
    DOCS.forEach(x => { const rr = (revBy[x._rid] || revBy[x.kode] || []).sort((a, b) => a.rev - b.rev); if (rr.length) x.riwayat = rr; });
    SM = sm.map(s => smDariServer(s, disp));
    const butirBy = {};
    agB.forEach(x => { (butirBy[x.agenda_id] = butirBy[x.agenda_id] || []).push([x.nama || '', x.status || 'warn', x.ket || '', x.id]); });
    AGENDA = ag.map(a => ({ _rid: a.id, id: a.id, nama: a.nama || '', tanggal: tglId(a.tanggal), tempat: a.tempat || '', catatan: a.catatan || '', butir: butirBy[a.id] || [] }));
    DOCS.forEach(x => { const m = String(x.kode || '').match(/^(\d+)/); if (m) seq.SURAT = Math.max(seq.SURAT || 0, +m[1]); });
    SM.forEach(s => { const m = String(s.agenda || '').match(/^SM-(\d+)/); if (m) seq.SM = Math.max(seq.SM || 0, +m[1]); });
    DATA_OK = true;
  }
  async function muatData() {
    if (DATA_OK) { await muatKop(); return true; }
    // Jalur cepat ala SIPINTAR: 1 panggilan dasbor utk semua tabel (auth 1x di server).
    try {
      const d = await api('dasbor');
      if (d && ('dok' in d || 'sm' in d || 'ag' in d)) { terapkanDasbor(d); simpanSnapshot(d); return DATA_OK; }
    } catch (e) { /* backend lama: lanjut jalur lama */ }
    const ambil = async (tabel) => { try { const r = await api('list', { tabel, opsi: { per: 200 } }); return (r && r.baris) || []; } catch (e) { return []; } };
    const [dok, rev, sm, disp, ag, agB, lg] = await Promise.all([ambil('Dokumen'), ambil('Revisi'), ambil('SuratMasuk'), ambil('Disposisi'), ambil('Agenda'), ambil('AgendaButir'), Promise.resolve([])]);
    await muatKop();
    // Kelola Templat DIMATIKAN sementara: TemplatKustom tidak dimuat.
    if (dok.length || sm.length || ag.length) {
      DOCS = dok.map(dokDariServer);
      // tempel riwayat revisi per dokumen
      const revBy = {};
      rev.forEach(x => { (revBy[x.dokumen_id] = revBy[x.dokumen_id] || []).push({ _rid: x.id, rev: +x.rev || 1, tanggal: tglId(x.tanggal), oleh: x.oleh || '', catatan: x.catatan || '', file_id: x.file_id || '', file_nama: x.file_nama || '', file_url: x.file_url || '' }); });
      DOCS.forEach(d => { const rr = (revBy[d._rid] || revBy[d.kode] || []).sort((a, b) => a.rev - b.rev); if (rr.length) d.riwayat = rr; });
      SM = sm.map(s => smDariServer(s, disp));
      const butirBy = {};
      agB.forEach(x => { (butirBy[x.agenda_id] = butirBy[x.agenda_id] || []).push([x.nama || '', x.status || 'warn', x.ket || '', x.id]); });
      AGENDA = ag.map(a => ({ _rid: a.id, id: a.id, nama: a.nama || '', tanggal: tglId(a.tanggal), tempat: a.tempat || '', catatan: a.catatan || '', butir: butirBy[a.id] || [] }));
      // sinkronkan urutan nomor surat/masuk dari data server
      DOCS.forEach(d => { const m = String(d.kode || '').match(/^(\d+)/); if (m) seq.SURAT = Math.max(seq.SURAT || 0, +m[1]); });
      SM.forEach(s => { const m = String(s.agenda || '').match(/^SM-(\d+)/); if (m) seq.SM = Math.max(seq.SM || 0, +m[1]); });
      DATA_OK = true;
    }
    return DATA_OK;
  }

  // Surat masuk
  let SM = [].map((r, i) => ({ id: i + 1, agenda: r[0], tglSurat: r[1], terima: r[2], asal: r[3], nomor: r[4], perihal: r[5], sifat: r[6], status: r[7], disp: r[8].map(x => ({ tgl: x[0], ke: x[1], instruksi: x[2], catatan: x[3], batas: x[4] })), berkas: 'Pindaian_' + r[0].replace(/\W+/g, '_') + '.pdf' }));

  const status = (d) => {
    if (d.status === 'Draf') return ['Draf', 'draft'];
    if (d.sampai) { const h = hari(d.sampai); if (h < 0) return ['Kedaluwarsa', 'bad']; if (h <= 60) return ['Segera berakhir', 'warn']; }
    return ['Berlaku', 'ok'];
  };
  const ALUR = ['Draf', 'Diajukan', 'Disahkan', 'Terkirim'];
  const alurB = { Draf: 'draft', Diajukan: 'warn', Disahkan: 'ok', Terkirim: 'info' };
  const smB = { Diterima: 'warn', Didisposisi: 'info', Selesai: 'ok' };
  // Cari toleran: id backend kini string UUID, pemanggil lama pakai +id (angka).
  // Bandingkan sebagai string + fallback ke _rid/kode/agenda agar popup selalu ketemu.
  const cariDok = (id) => DOCS.find(x => String(x.id) === String(id) || (x._lokal != null && String(x._lokal) === String(id)) || (x._rid && String(x._rid) === String(id)) || (x.kode && String(x.kode) === String(id)));
  const cariSM = (id) => SM.find(x => String(x.id) === String(id) || (x._lokal != null && String(x._lokal) === String(id)) || (x._rid && String(x._rid) === String(id)) || (x.agenda && String(x.agenda) === String(id)));
  const cariAgenda = (id) => AGENDA.find(x => String(x.id) === String(id) || (x._lokal != null && String(x._lokal) === String(id)) || (x._rid && String(x._rid) === String(id)));
  // Catat aktivitas: teks dititipkan ke panggilan simpan berikutnya (server yang menulis Log).
  // Bila tidak ada simpan yang menyusul (mis. mencetak), dikirim sendiri lewat aksi 'catat'.
  const catat = (m, siapa) => {
    CATATAN = m;
    setTimeout(() => { if (CATATAN === m) { CATATAN = ''; api('catat', { data: { pesan: m } }).catch(() => {}); } }, 0);
  };
  // Simpan latar: UI diperbarui dulu, server menyusul diam-diam (tanpa await).
  // Simpan latar: layar diperbarui dulu, server menyusul. Status tampil di pojok; bila gagal muncul
  // peringatan yang tetap terlihat dengan tombol Coba lagi (data belum aman sebelum tersimpan).
  let SIMPAN_JALAN = 0;
  const GAGAL = [];
  const statusSimpan = () => {
    const el = document.getElementById('simpanSt'); if (!el) return;
    clearTimeout(el._t);
    if (SIMPAN_JALAN > 0) { el.className = 'simpan on'; el.textContent = 'Menyimpan…'; }
    else if (el.classList.contains('on')) { el.className = 'simpan ok'; el.textContent = 'Tersimpan'; el._t = setTimeout(() => { el.className = 'simpan'; el.textContent = ''; }, 2500); }
    gambarGagal();
  };
  const gambarGagal = () => {
    const bar = document.getElementById('gagalBar'); if (!bar) return;
    bar.hidden = !GAGAL.length;
    bar.innerHTML = GAGAL.length ? `<div><b>${GAGAL.length} perubahan belum tersimpan ke server.</b> ${esc(GAGAL[GAGAL.length - 1].pesan)}</div><div class="acts" style="margin:0"><button class="btn" type="button" data-g="ulang">Coba lagi</button><button class="btn ghost" type="button" data-g="muat">Muat ulang data</button></div>` : '';
  };
  // Antrean berurutan: simpan berikutnya menunggu yang sebelumnya, sehingga data baru sudah punya
  // ID server sebelum diubah/didisposisi (tidak ada perubahan yang hilang karena terlalu cepat).
  let ANTRIAN = Promise.resolve();
  const latar = (fn, gagal) => {
    const jalan = () => {
      SIMPAN_JALAN++; statusSimpan();
      // Teks catatan aktivitas diambil sekarang (bukan saat antrean berjalan) dan dipakai lagi bila diulang.
      if (jalan.cat === undefined) { jalan.cat = CATATAN; CATATAN = ''; }

  const simpanDokBackend = (d) => { if (d && (d._rid || d._siap)) latar(() => api('ubah', { tabel: 'Dokumen', id: d._rid, data: dokKeServer(d) }), 'Perubahan dokumen'); };

  /* ---------- Peran & hak akses (demo frontend; versi akhir disaring di backend) ----------

  const bolehLihatKat = (kat) => { const k = kunciPeran(); if (['Ketua', 'Admin', 'Sekretariat'].includes(k)) return true; if (!KAT_TERBATAS.includes(kat)) return true; if (kat === 'ASR') return ['Mutu', 'Sertifikasi'].includes(k); return ['Sertifikasi', 'Administrasi'].includes(k); };
  const bolehUbahKat = (kat) => { const k = kunciPeran(); if (k === 'Ketua') return true; const h = HAK_UBAH[k]; if (h === 'SEMUA') return true; if (Array.isArray(h)) return h.includes(kat); return false; };
  const bolehSahkan = () => kunciPeran() === 'Ketua';

  const adaBerkas = (x) => !!(x && (x.file_id || x.file_url));
  // Berkas arsip privat: diambil lewat server (hak akses diperiksa), lalu dibuka di tab baru.
  async function bukaBerkas(x) {
    if (!x) return;
    if (!x.file_id) { if (x.file_url) window.open(x.file_url, '_blank', 'noopener'); return; }
    const w = window.open('', '_blank');
    try { if (w) w.document.write('<p style="font-family:system-ui,sans-serif;padding:24px">Membuka berkas…</p>'); } catch (e) {}
    try {
      const f = await api('lihatBerkas', { data: { file_id: x.file_id } });
      const bin = atob(f.base64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], { type: f.mime }));
      if (w && /^(application\/pdf|image\/)/.test(f.mime)) w.location.href = url;
      else { if (w) w.close(); const a = document.createElement('a'); a.href = url; a.download = f.nama; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(() => URL.revokeObjectURL(url), 120000);

      if (x.file_url && /tidak dikenal|Tabel ""/i.test(e.message)) { if (w) w.location.href = x.file_url; else window.open(x.file_url, '_blank', 'noopener'); return; }

  const tandaiMemperbarui = (on) => { document.body.classList.toggle('memperbarui', !!on); const el = document.getElementById('simpanSt'); if (el && on && !SIMPAN_JALAN) { el.className = 'simpan on'; el.textContent = 'Memperbarui…'; } else if (el && !on && !SIMPAN_JALAN) { el.className = 'simpan'; el.textContent = ''; } };

  function render() {
    if (VIEW === 'agenda' && !peranBolehAgenda()) VIEW = 'ringkasan';
    if (VIEW === 'dokumen' && FK && !bolehLihatKat(FK)) FK = '';
    document.querySelectorAll('.side button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW && (VIEW !== 'dokumen' || (b.dataset.k || '') === FK)));
    const v = document.getElementById('view'), T = document.getElementById('title');
    const go = (root) => root.querySelectorAll('[data-go]').forEach(a => a.onclick = (e) => { e.preventDefault(); VIEW = a.dataset.go; FK = a.dataset.k || ''; render(); });
    ({ ringkasan: vRingkasan, dokumen: vDokumen, arsip: vArsip, pengingat: vPengingat, agenda: vAgenda, masuk: vMasuk, keluar: vKeluar, templat: vTemplat, pedoman: vPedoman, pengguna: vPengguna }[VIEW] || vRingkasan)(v, T);
    go(v);
  }

  function vRingkasan(v, T) {
    T.textContent = 'Ringkasan — ' + PERAN_AKTIF;
    const lihat = (d) => !d.arsip && bolehLihatKat(d.kat);
    const warn = DOCS.filter(d => lihat(d) && status(d)[1] === 'warn'), bad = DOCS.filter(d => lihat(d) && status(d)[1] === 'bad'), draf = DOCS.filter(d => lihat(d) && d.status === 'Draf');
    const agAktif = AGENDA.slice().sort((a, b) => (a.tanggal || '9999').localeCompare(b.tanggal || '9999'))[0];
    const agSiap = agAktif ? agAktif.butir.filter(b => b[1] === 'ok').length : 0;
    const saya = dispUntukSaya(), lewat = dispLewatBatas().filter(s => saya.includes(s));
    const smBuka = (['Ketua', 'Admin', 'Sekretariat'].includes(kunciPeran()) ? SM.filter(s => s.status !== 'Selesai') : saya);
    const tunggu = DOCS.filter(d => lihat(d) && d.surat && ['Draf', 'Diajukan'].includes(d.alur));
    const skTunggu = DOCS.filter(d => d.surat && d.alur === 'Diajukan').length;
    const tugasSaya = saya.length + (bolehSahkan() ? skTunggu : 0);
    v.innerHTML = `<p class="muted lead">Halo, <b>${esc(PERAN_AKTIF)}</b>. ${tugasSaya ? `Ada <b>${tugasSaya} tugas</b> menunggu Anda.` : 'Tidak ada tugas menunggu Anda.'}${['Ketua', 'Admin', 'Sekretariat'].includes(kunciPeran()) ? '' : ' Anda hanya dapat mengubah dokumen kategori Anda; dokumen lain tampil baca-saja.'}</p>
      ${saya.length || lewat.length || bolehSahkan() && skTunggu ? `<div class="panel" style="border-left:4px solid var(--red);margin-bottom:14px"><h2>Tugas saya</h2><ul class="list">${saya.map(s => `<li data-sm="${s.id}" style="cursor:pointer"><span><b>${esc(s.perihal)}</b><br><span class="muted" style="font-size:.82rem">Disposisi · ${esc(s.agenda)}${s.disp.some(x => x.batas && x.batas < HARI_INI) ? ' · <b style="color:var(--red)">lewat batas</b>' : ''}</span></span><span class="badge ${smB[s.status]}">${s.status}</span></li>`).join('')}${bolehSahkan() && skTunggu ? `<li><span><b>${skTunggu} surat menunggu pengesahan Ketua</b><br><span class="muted" style="font-size:.82rem">Buka Surat keluar → status Diajukan</span></span><span class="badge warn">Diajukan</span></li>` : ''}</ul></div>` : ''}
      <div class="grid g4" style="margin-bottom:14px">
        <a href="#" class="panel stat" data-go="dokumen"><b>${DOCS.filter(lihat).length}</b><span>dokumen dapat Anda lihat</span></a>
        <a href="#" class="panel stat warn" data-go="pengingat"><b>${warn.length}</b><span>segera berakhir (60 hari)</span></a>
        <a href="#" class="panel stat bad" data-go="pengingat"><b>${bad.length}</b><span>sudah kedaluwarsa</span></a>
        <a href="#" class="panel stat" data-go="keluar"><b>${draf.length}</b><span>draf menunggu pengesahan</span></a></div>
      <div class="grid g2" style="margin-bottom:14px">
        <div class="panel"><h2>Surat masuk perlu tindak lanjut</h2><ul class="list">${smBuka.slice(0, 5).map(s => `<li data-sm="${s.id}" style="cursor:pointer"><span><b>${esc(s.perihal)}</b><br><span class="muted" style="font-size:.82rem">${esc(s.asal)} · ${esc(s.agenda)}</span></span><span class="badge ${smB[s.status]}">${s.status}</span></li>`).join('') || '<li class="muted">Semua surat masuk sudah selesai.</li>'}</ul><p style="margin:10px 0 0"><a href="#" data-go="masuk">${smBuka.length > 5 ? `Lihat semua (${smBuka.length})` : 'Buka surat masuk'}</a></p></div>
        <div class="panel"><h2>Surat keluar dalam proses</h2><ul class="list">${tunggu.slice(0, 5).map(d => `<li data-id="${d.id}" style="cursor:pointer"><span><b>${esc(d.judul)}</b><br><span class="muted code" style="font-size:.8rem">${esc(d.kode)}</span></span><span class="badge ${alurB[d.alur]}">${d.alur}</span></li>`).join('') || '<li class="muted">Tidak ada.</li>'}</ul><p style="margin:10px 0 0"><a href="#" data-go="keluar">${tunggu.length > 5 ? `Lihat semua (${tunggu.length})` : 'Buka surat keluar'}</a></p></div>
      </div>
      ${peranBolehAgenda() ? `<div class="panel agenda-ring" style="margin-bottom:14px"><h2>Agenda terdekat${agAktif ? ': ' + esc(agAktif.nama) : ''}</h2>${agAktif ? `<div class="bar"><i style="width:${agAktif.butir.length ? Math.round(agSiap / agAktif.butir.length * 100) : 0}%"></i></div><p class="muted" style="font-size:.88rem">${agSiap} dari ${agAktif.butir.length} butir siap${agAktif.tanggal ? ' · ' + tgl(agAktif.tanggal) : ''}.</p>
          <div class="check-wrap">${agAktif.butir.filter(b => b[1] !== 'ok').slice(0, 6).map(b => `<div class="check"><span class="dot ${b[1]}"></span><div><b>${esc(b[0])}</b><div class="muted" style="font-size:.84rem">${esc(b[2] || '')}</div></div><span></span></div>`).join('')}</div>` : '<p class="muted">Belum ada agenda.</p>'}
          <p style="margin:10px 0 0"><a href="#" data-go="agenda">Lihat semua agenda</a></p></div>` : ''}
      <div class="panel"><h2>Per kategori</h2><div class="grid g4">${KAT.filter(k => bolehLihatKat(k[0])).map(k => `<a href="#" data-go="dokumen" data-k="${k[0]}" class="katbox"><b style="font-size:1.4rem">${DOCS.filter(d => !d.arsip && d.kat === k[0]).length}</b><div style="font-weight:700">${esc(k[1])}</div><div class="muted" style="font-size:.8rem">${esc(k[2])}</div></a>`).join('')}</div></div>`;
    v.querySelectorAll('[data-sm]').forEach(li => li.onclick = () => detailMasuk(li.dataset.sm));
    v.querySelectorAll('li[data-id]').forEach(li => li.onclick = () => detail(li.dataset.id));
  }

  function vDokumen(v, T) {
    T.textContent = FK ? katNama(FK) : 'Semua dokumen';
    const k = KAT.find(x => x[0] === FK), f = fl();
    const ubah = !FK || bolehUbahKat(FK);
    v.innerHTML = `${k ? `<p class="muted lead">${esc(k[2])} · Masa simpan: ${esc(k[3])}</p>` : ''}${!ubah && FK ? '<p class="note">Kategori ini baca-saja untuk peran Anda. Perubahan hanya oleh penanggung jawab kategori.</p>' : ''}
      ${toolbar(f, ['Berlaku', 'Segera berakhir', 'Kedaluwarsa', 'Draf'], 'Cari judul atau nomor dokumen')}
      <div class="table-wrap"><table><thead><tr><th>Nomor</th><th>Judul</th>${FK ? '' : '<th>Kategori</th>'}<th>Terbit</th><th>Rev.</th><th>Berlaku sampai</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div><div class="pager" id="pg"></div>`;
    const daftar = () => DOCS.filter(d => !d.arsip && bolehLihatKat(d.kat) && (!FK || d.kat === FK) && (!f.st || status(d)[0] === f.st) && dalamRentang(d.terbit, f) && (!f.q || (d.judul + ' ' + d.kode).toLowerCase().includes(f.q.toLowerCase())))
      .sort((a, b) => (b.terbit || '9999').localeCompare(a.terbit || '9999'));
    const draw = () => {
      const list = daftar();
      document.getElementById('tb').innerHTML = halaman(list, f).map(d => { const s = status(d); return `<tr data-id="${d.id}"><td class="code" data-l="Nomor">${esc(d.kode)}</td><td data-l="Judul">${esc(d.judul)}<div class="muted" style="font-size:.8rem">${esc(d.pemilik)}${d.tpl ? ' · <span class="chip">dari templat</span>' : ''}${d.surat ? ' · <span class="chip">surat keluar</span>' : ''}</div></td>${FK ? '' : `<td data-l="Kategori">${esc(katNama(d.kat))}</td>`}<td data-l="Terbit">${tgl(d.terbit)}</td><td data-l="Revisi">${d.rev}</td><td data-l="Berlaku sampai">${d.sampai ? tgl(d.sampai) : '—'}</td><td data-l="Status"><span class="badge ${s[1]}">${s[0]}</span></td></tr>`; }).join('') || `<tr><td colspan="7" class="muted kosong">Tidak ada dokumen yang cocok dengan filter.</td></tr>`;
      pager(list.length, f, draw);
    };
    ikatToolbar(f, draw);
    document.getElementById('ex').onclick = () => unduhCSV('arsip-dokumen' + (FK ? '-' + FK : ''), ['Nomor', 'Judul', 'Kategori', 'Penanggung jawab', 'Terbit', 'Berlaku sampai', 'Revisi', 'Status'], daftar().map(d => [d.kode, d.judul, katNama(d.kat), d.pemilik, d.terbit, d.sampai, d.rev, status(d)[0]]));
    document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) detail(tr.dataset.id); };
    draw();
  }

  /* ---------- Dokumen arsip: yg sudah diarsipkan, filter per kategori ---------- */
  function vArsip(v, T) {
    T.textContent = 'Dokumen arsip';
    const f = fl(); f.kat = f.kat || ''; f.jenis = f.jenis || '';
    const opsiKat = KAT.filter(k => bolehLihatKat(k[0]));
    v.innerHTML = `<p class="muted lead">Dokumen final dan surat masuk yang sudah diarsipkan. Saring berdasarkan jenis + kategori, atau cari judul/nomor.</p>
      <div class="toolbar">
      <input id="q" type="search" placeholder="Cari judul, nomor, atau perihal" value="${esc(f.q)}">
      <button class="btn ghost tb-filter" type="button" aria-expanded="false">Filter${f.jenis || f.kat || f.dari || f.sampai ? ' •' : ''}</button>
      <div class="tb-more"><select id="fjns"><option value="">Semua jenis</option><option value="dok"${f.jenis === 'dok' ? ' selected' : ''}>Dokumen</option><option value="sm"${f.jenis === 'sm' ? ' selected' : ''}>Surat masuk</option></select>
      <select id="fkat"><option value="">Semua kategori</option>${opsiKat.map(k => `<option value="${k[0]}"${f.kat === k[0] ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select>
      <label class="dt">Dari<input type="date" id="fd" value="${f.dari}"></label><label class="dt">Sampai<input type="date" id="fe" value="${f.sampai}"></label>
      <button class="btn ghost" id="ex" type="button">Ekspor Excel</button></div></div>
      <h3 style="margin:14px 0 8px">Dokumen</h3>
      <div class="table-wrap"><table><thead><tr><th>Nomor</th><th>Judul</th><th>Kategori</th><th>Terbit</th><th>Rev.</th><th>Berlaku sampai</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div><div class="pager" id="pg"></div>
      <h3 style="margin:18px 0 8px">Surat masuk</h3>
      <div class="table-wrap"><table><thead><tr><th>No. agenda</th><th>Diterima</th><th>Pengirim & nomor surat</th><th>Perihal</th><th>Status</th></tr></thead><tbody id="tbsm"></tbody></table></div>`;
    const daftar = () => DOCS.filter(d => d.arsip && bolehLihatKat(d.kat) && (!f.jenis || f.jenis === 'dok') && (!f.kat || d.kat === f.kat) && dalamRentang(d.terbit, f) && (!f.q || (d.judul + ' ' + d.kode).toLowerCase().includes(f.q.toLowerCase())))
      .sort((a, b) => (b.terbit || '9999').localeCompare(a.terbit || '9999'));
    const daftarSM = () => SM.filter(s => s.arsip && (!f.jenis || f.jenis === 'sm') && dalamRentang(s.terima, f) && (!f.q || (s.perihal + ' ' + s.asal + ' ' + s.nomor + ' ' + s.agenda).toLowerCase().includes(f.q.toLowerCase())))
      .sort((a, b) => b.agenda.localeCompare(a.agenda));
    const draw = () => {
      const list = daftar();
      document.getElementById('tb').innerHTML = halaman(list, f).map(d => { const s = status(d); return `<tr data-id="${d.id}"><td class="code" data-l="Nomor">${esc(d.kode)}</td><td data-l="Judul">${esc(d.judul)}<div class="muted" style="font-size:.8rem">${esc(d.pemilik)}${d.tpl ? ' · <span class="chip">dari templat</span>' : ''}${d.surat ? ' · <span class="chip">surat keluar</span>' : ''}</div></td><td data-l="Kategori">${esc(katNama(d.kat))}</td><td data-l="Terbit">${tgl(d.terbit)}</td><td data-l="Revisi">${d.rev}</td><td data-l="Berlaku sampai">${d.sampai ? tgl(d.sampai) : '—'}</td><td data-l="Status"><span class="badge ${s[1]}">${s[0]}</span></td></tr>`; }).join('') || `<tr><td colspan="7" class="muted kosong">Belum ada dokumen arsip yang cocok.</td></tr>`;
      pager(list.length, f, draw);
      const lsm = daftarSM();
      document.getElementById('tbsm').innerHTML = lsm.map(s => `<tr data-sm="${s.id}"><td class="code" data-l="No. agenda">${esc(s.agenda)}</td><td data-l="Diterima">${tgl(s.terima)}</td><td data-l="Pengirim">${esc(s.asal)}<div class="muted" style="font-size:.8rem">${esc(s.nomor)}</div></td><td data-l="Perihal">${esc(s.perihal)}${adaBerkas(s) ? ' · <span class="chip">ada berkas</span>' : ''}</td><td data-l="Status"><span class="badge ${smB[s.status]}">${s.status}</span></td></tr>`).join('') || `<tr><td colspan="5" class="muted kosong">Belum ada surat masuk yang diarsipkan.</td></tr>`;
    };
    document.getElementById('q').oninput = (e) => { f.q = e.target.value; f.pg = 1; draw(); };
    document.getElementById('fjns').onchange = (e) => { f.jenis = e.target.value; f.pg = 1; draw(); };
    document.getElementById('fkat').onchange = (e) => { f.kat = e.target.value; f.pg = 1; draw(); };
    document.getElementById('fd').onchange = (e) => { f.dari = e.target.value; f.pg = 1; draw(); };
    document.getElementById('fe').onchange = (e) => { f.sampai = e.target.value; f.pg = 1; draw(); };
    document.getElementById('ex').onclick = () => unduhCSV('dokumen-arsip', ['Jenis', 'Nomor', 'Judul/Perihal', 'Kategori/Pengirim', 'Penanggung jawab', 'Tanggal', 'Revisi', 'Status'], daftar().map(d => ['Dokumen', d.kode, d.judul, katNama(d.kat), d.pemilik, d.terbit, d.rev, status(d)[0]]).concat(daftarSM().map(s => ['Surat masuk', s.agenda, s.perihal, s.asal + ' / ' + s.nomor, '', s.terima, '', s.status])));
    document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) detail(tr.dataset.id); };
    document.getElementById('tbsm').onclick = (e) => { const tr = e.target.closest('tr[data-sm]'); if (tr) detailMasuk(tr.dataset.sm); };
    draw();
  }

  function vPengingat(v, T) {
    T.textContent = 'Pengingat';
    const list = DOCS.filter(d => bolehLihatKat(d.kat) && (['warn', 'bad'].includes(status(d)[1]) || d.status === 'Draf')).sort((a, b) => (a.sampai || '9999').localeCompare(b.sampai || '9999'));
    v.innerHTML = `<p class="muted lead">Dokumen yang kedaluwarsa, berakhir dalam 60 hari, atau masih draf. Pengingat juga dikirim ke email penanggung jawab setiap Senin.</p>
      <div class="panel"><ul class="list">${list.map(d => { const s = status(d); const h = d.sampai ? hari(d.sampai) : null; return `<li data-id="${d.id}" style="cursor:pointer"><span><b>${esc(d.judul)}</b><br><span class="muted" style="font-size:.84rem">${esc(d.kode)} · ${esc(d.pemilik)}</span></span><span style="text-align:right"><span class="badge ${s[1]}">${s[0]}</span><br><span class="muted" style="font-size:.8rem">${h === null ? 'Perlu pengesahan' : h < 0 ? 'Lewat ' + (-h) + ' hari' : h + ' hari lagi'}</span></span></li>`; }).join('')}</ul></div>`;
    v.querySelectorAll('li[data-id]').forEach(li => li.onclick = () => detail(li.dataset.id));
  }

  function vAgenda(v, T) {
    T.textContent = 'Agenda terdekat';
    if (!peranBolehAgenda()) { v.innerHTML = `<div class="panel"><h2>Akses terbatas</h2><p class="muted">Tab Agenda terdekat hanya untuk Admin, Sekretariat, dan Ketua LSP.</p></div>`; return; }
    const daftar = AGENDA.slice().sort((a, b) => (a.tanggal || '9999').localeCompare(b.tanggal || '9999'));
    v.innerHTML = `<p class="muted lead">Rekap persiapan dokumen untuk setiap kegiatan. Pilih agenda untuk melihat butir dokumennya, atau tambah agenda baru.</p>
      <div class="toolbar"><button class="btn" id="addAg" type="button">+ Tambah agenda</button></div>
      ${daftar.map(a => { const ok = a.butir.filter(b => b[1] === 'ok').length; return `<div class="panel" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:start"><div><h2 style="margin-bottom:2px">${esc(a.nama)}</h2><div class="muted" style="font-size:.86rem">${tgl(a.tanggal)}${a.tempat ? ' · ' + esc(a.tempat) : ''}</div>${a.catatan ? `<div class="muted" style="font-size:.86rem">${esc(a.catatan)}</div>` : ''}</div><span class="badge ${ok === a.butir.length ? 'ok' : 'warn'}">${ok}/${a.butir.length} siap</span></div>
        <div class="bar"><i style="width:${a.butir.length ? Math.round(ok / a.butir.length * 100) : 0}%"></i></div>
        ${a.butir.map((b, bi) => `<div class="check"><span class="dot ${b[1]}"></span><div><b>${esc(b[0])}</b><div class="muted" style="font-size:.84rem">${esc(b[2] || '')}</div></div><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="badge ${b[1]}">${b[1] === 'ok' ? 'Siap' : b[1] === 'warn' ? 'Perlu dilengkapi' : 'Mendesak'}</span><button class="btn ghost" data-ubah="${a.id}:${bi}" type="button" style="padding:4px 10px;font-size:.78rem">Ubah</button><button class="btn ghost" data-buang="${a.id}:${bi}" type="button" style="padding:4px 10px;font-size:.78rem">Hapus</button></span></div>`).join('') || '<p class="muted" style="font-size:.86rem">Belum ada butir.</p>'}
        <div class="acts"><button class="btn ghost" data-tambah="${a.id}" type="button">+ Tambah butir</button><button class="btn ghost" data-hapus="${a.id}" type="button">Hapus agenda</button></div></div>`; }).join('') || '<div class="panel muted">Belum ada agenda.</div>'}`;
    document.getElementById('addAg').onclick = () => {
      const back = drawer(`<h2>Tambah agenda</h2><form class="form" id="fAg"><label class="f">Nama agenda<input name="nama" required placeholder="mis. Surveilans BNSP 2027"></label><div class="row2"><label class="f">Tanggal<input type="date" name="tanggal" required></label><label class="f">Tempat<input name="tempat"></label></div><label class="f">Catatan<textarea name="catatan" rows="2"></textarea></label><div><button class="btn" type="submit">Simpan agenda</button></div></form>`);
      back.querySelector('#fAg').onsubmit = (e) => { e.preventDefault(); const g = new FormData(e.target); const baru = { id: AGENDA_ID++, nama: (g.get('nama') || '').trim(), tanggal: g.get('tanggal'), tempat: (g.get('tempat') || '').trim(), catatan: (g.get('catatan') || '').trim(), butir: [] }; AGENDA.push(baru); catat('Menambah agenda ' + g.get('nama')); tutupDrawer(); toast('Agenda tersimpan'); render(); baru._siap = true; latar(() => api('tambah', { tabel: 'Agenda', data: { nama: baru.nama, tanggal: baru.tanggal, tempat: baru.tempat, catatan: baru.catatan } }).then(b => { if (b && b.id) { baru._lokal = baru.id; baru._rid = b.id; baru.id = b.id; } }), 'Tambah agenda'); };
    };
    v.querySelectorAll('[data-tambah]').forEach(b => b.onclick = () => {
      const a = cariAgenda(b.dataset.tambah); if (!a) { toast('Agenda tidak ditemukan.'); return; }
      const back = drawer(`<h2>Tambah butir — ${esc(a.nama)}</h2><form class="form" id="fB"><label class="f">Butir dokumen<input name="nama" required placeholder="mis. SK penugasan panitia"></label><label class="f">Status<select name="st"><option value="warn">Perlu dilengkapi</option><option value="ok">Siap</option><option value="bad">Mendesak</option></select></label><label class="f">Keterangan<input name="ket"></label><div><button class="btn" type="submit">Simpan butir</button></div></form>`);
      back.querySelector('#fB').onsubmit = (e) => { e.preventDefault(); const g = new FormData(e.target); const item = [(g.get('nama') || '').trim(), g.get('st'), (g.get('ket') || '').trim()]; a.butir.push(item); catat('Menambah butir agenda ' + a.nama); tutupDrawer(); toast('Butir tersimpan'); render(); if (a._rid || a._siap) latar(() => api('tambah', { tabel: 'AgendaButir', data: { agenda_id: String(a._rid), nama: item[0], status: item[1], ket: item[2] } }).then(b => { if (b && b.id) item.push(b.id); }), 'Tambah butir'); };
    });

        const fl = await bacaBerkas(f.berkas);

          if (file_url && file_url !== (s.file_url || '')) { file_nama = fl.nama; }

            try {

      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Simpan perubahan'; return; }

    };
  }

  function formMasuk() {
    tutupDrawer();

    const back = drawer(`<h2>Catat surat masuk</h2><form class="form" id="fSM">

      <div><button class="btn" type="submit" id="btnSM">Simpan surat masuk</button></div></form>`);

        if (fl && !file_url) {
          try {
            const up = await api('unggahBerkas', { data: { nama: fl.nama, mime: fl.mime, base64: fl.base64, kat: 'KOR' } });

      seq.SM++;

      const act = a.dataset.a, ubahAlur = (al, pesan, siapa) => { if (al === 'Disahkan' && !bolehSahkan()) { toast('Hanya Ketua LSP yang dapat mengesahkan'); return; } if (['Diajukan', 'Draf', 'Terkirim'].includes(al) && !bisaUbah && al !== 'Draf') { toast('Di luar kategori Anda'); return; } d.alur = al; d.status = al === 'Disahkan' || al === 'Terkirim' ? 'Berlaku' : 'Draf'; simpanDokBackend(d); catat(pesan + ' ' + d.kode, siapa); toast(pesan + ' ' + d.kode); shell(); detail(id); };
      if (act === 'lihat') window.cetakDokumen(htmlDok(d), d.judul);
      else if (act === 'ubah') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } tutupDrawer(); window.bukaTemplat(d.tpl.id, API, { id: d.id, kat: d.kat, nomor: d.kode, data: d.tpl.data }); }
      else if (act === 'ajukan') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } ubahAlur('Diajukan', 'Mengajukan pengesahan'); }
      else if (act === 'kembali') { if (!bolehSahkan()) { toast('Hanya Ketua LSP'); return; } ubahAlur('Draf', 'Mengembalikan ke draf', 'Ketua LSP'); }
      else if (act === 'sahkan') ubahAlur('Disahkan', 'Mengesahkan', 'Ketua LSP');
      else if (act === 'kirim') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } ubahAlur('Terkirim', 'Menandai terkirim'); }
      else if (act === 'edit') { if (!bolehKelolaArsip(d) && !bisaUbah) { toast('Di luar kategori Anda'); return; } tutupDrawer(); formEditDok(id); }
      else if (act === 'arsip') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } d.arsip = true; d.status = 'Berlaku'; if (!d.terbit) d.terbit = HARI_INI; simpanDokBackend(d); catat('Mengarsipkan ' + d.kode); toast('Diarsipkan: ' + d.kode); shell(); detail(id); }
      else if (act === 'keluar-arsip') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } d.arsip = false; simpanDokBackend(d); catat('Mengeluarkan dari arsip ' + d.kode); toast('Dikeluarkan dari arsip: ' + d.kode); shell(); detail(id); }
      else if (act === 'tanpa-berkas') { toast('Belum ada berkas Drive untuk dokumen ini. Tambahkan lewat Ubah data atau Unggah revisi.'); return; }
      else if (act === 'buka') { bukaBerkas(d); return; }
      else if (act === 'buka-rev') { const info = (d.riwayat || []).find(x => String(x.rev) === String(a.dataset.rev)); if (info) bukaBerkas(info); return; }
      else if (act === 'revisi') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } tutupDrawer(); formRevisi(id); return; }
      else if (act === 'hapus') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } if (!(await tanya('Hapus ' + (d.surat ? 'surat ' : 'dokumen ') + d.kode + ' — ' + d.judul + '?' + (d.arsip ? ' (dokumen arsip)' : '')))) return; DOCS = DOCS.filter(x => x.id !== id); catat('Menghapus ' + d.kode); tutupDrawer(); shell(); toast('Dihapus: ' + d.kode); if (d._rid || d._siap) latar(() => api('hapus', { tabel: 'Dokumen', id: d._rid }), 'Hapus dokumen'); }
      else toast(act);
    });
  }

  /* ---------- Ubah data dokumen (judul, kategori, penanggung jawab, tanggal, tautan) ---------- */
  function formEditDok(id) {
    const d = cariDok(id); if (!d) { toast('Dokumen tidak ditemukan.'); return; }
    if (!bolehUbahKat(d.kat)) { toast('Di luar kategori Anda'); return; }
    const katBoleh = KAT.filter(k => bolehUbahKat(k[0]));
    const back = drawer(`<h2>Ubah data dokumen</h2><p class="muted" style="margin-top:-6px">${esc(d.kode)}</p>
      <form class="form" id="fED"><label class="f">Judul / perihal<input name="judul" required value="${esc(d.judul)}"></label>
      <label class="f">Kategori arsip<select name="kat">${katBoleh.map(k => `<option value="${k[0]}"${k[0] === d.kat ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Penanggung jawab<input name="pemilik" value="${esc(d.pemilik || '')}"></label>
      <div class="row2"><label class="f">Tanggal<input type="date" name="terbit" value="${esc(d.terbit || '')}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai" value="${esc(d.sampai || '')}"></label></div>
      <label class="f">Ganti berkas (opsional, PDF/DOCX/XLSX/JPG maks 10 MB)<input type="file" name="berkas" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label>
      <label class="f">atau tautan berkas Drive (agar nama berkas bisa diklik)<input name="tautan" value="${esc(d.file_url || '')}" placeholder="https://drive.google.com/..."></label>
      <div><button class="btn" type="submit" id="btnED">Simpan perubahan</button></div></form>`);
    const f = back.querySelector('#fED');
    f.onsubmit = async (e) => {
      e.preventDefault();
      const k = f.kat.value;
      if (!bolehUbahKat(k)) { toast('Kategori ' + k + ' di luar wewenang peran Anda'); return; }
      const btn = back.querySelector('#btnED'); btn.disabled = true; btn.textContent = 'Menyimpan…';
      let file_id = d.file_id || '', file_nama = d.berkas, file_url = f.tautan.value.trim();
      try {
        const fl = await bacaBerkas(f.berkas);
        if (fl) {
          if (file_url && file_url !== (d.file_url || '')) { file_nama = fl.nama; }
          else {
            try {
              const up = await api('unggahBerkas', { data: { nama: fl.nama, mime: fl.mime, base64: fl.base64, kat: k } });
              file_id = up.file_id || file_id; file_nama = up.file_nama || fl.nama; file_url = up.file_url || file_url;
            } catch (err) { toast(err.message + ' Data tetap disimpan tanpa mengganti tautan.'); }
          }
        }
      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Simpan perubahan'; return; }
      Object.assign(d, { judul: f.judul.value.trim(), kat: k, pemilik: f.pemilik.value.trim() || d.pemilik, terbit: f.terbit.value, sampai: f.sampai.value, file_id, berkas: file_nama || d.berkas, file_url });
      catat('Mengubah data ' + d.kode); tutupDrawer(); toast('Perubahan tersimpan: ' + d.kode); shell(); detail(id);
      simpanDokBackend(d);
    };
  }

  /* ---------- Unggah revisi: berkas baru -> Revisi berikutnya, riwayat lama tetap ---------- */
  function formRevisi(id) {
    const d = cariDok(id); if (!d) { toast('Dokumen tidak ditemukan.'); return; }
    if (!bolehUbahKat(d.kat)) { toast('Di luar kategori Anda'); return; }
    const back = drawer(`<h2>Unggah revisi ${d.rev + 1}</h2><p class="muted" style="margin-top:-6px">${esc(d.kode)} — ${esc(d.judul)}</p>
      <p class="muted" style="font-size:.86rem">Revisi menaikkan nomor revisi (kini Rev. ${d.rev}) tanpa menghapus riwayat. Berkas tersimpan ke folder Drive kategori ${esc(d.kat)}.</p>
      <form class="form" id="fR"><label class="f">Berkas revisi (maks 10 MB)<input type="file" name="berkas" required accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label>
      <label class="f">atau tautan Drive<input name="tautan" placeholder="https://drive.google.com/..."></label>
      <label class="f">Catatan revisi<input name="catatan" placeholder="mis. Penyesuaian MUK sesuai masukan BNSP"></label>
      <div><button class="btn" type="submit" id="btnRev">Simpan revisi ${d.rev + 1}</button></div></form>`);
    const f = back.querySelector('#fR');
    f.onsubmit = async (e) => {
      e.preventDefault();
      const btn = back.querySelector('#btnRev'); btn.disabled = true; btn.textContent = 'Menyimpan…';
      let file_id = d.file_id || '', file_nama = d.berkas, file_url = (f.tautan.value || '').trim();
      try {
        const fl = await bacaBerkas(f.berkas);
        if (fl && !file_url) {
          const up = await api('unggahBerkas', { data: { nama: fl.nama, mime: fl.mime, base64: fl.base64, kat: d.kat } });
          file_id = up.file_id || file_id; file_nama = up.file_nama || fl.nama; file_url = up.file_url || file_url;
        } else if (fl && file_url) { file_nama = fl.nama; }
      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Simpan revisi ' + (d.rev + 1); return; }
      if (!file_url && !file_nama) { toast('Pilih berkas atau isi tautan Drive.'); btn.disabled = false; btn.textContent = 'Simpan revisi ' + (d.rev + 1); return; }
      const catatan = f.catatan.value.trim();
      d.riwayat = d.riwayat || [];
      Object.assign(d, { rev: d.rev + 1, terbit: HARI_INI, berkas: file_nama || d.berkas, file_id, file_url });
      const itemRev = { rev: d.rev, tanggal: HARI_INI, oleh: PERAN_AKTIF, catatan, file_id, file_nama: file_nama || d.berkas, file_url };
      d.riwayat.push(itemRev);
      catat('Mengunggah revisi ' + d.rev + ' ' + d.kode + (catatan ? ' — ' + catatan : ''));
      tutupDrawer(); toast('Revisi ' + d.rev + ' tersimpan: ' + d.kode); shell(); detail(id);
      if (d._rid) { const dataRev = { dokumen_id: String(d._rid), rev: String(d.rev), tanggal: HARI_INI, oleh: PERAN_AKTIF, catatan, file_id, file_nama: file_nama || d.berkas, file_url }, dataDok = dokKeServer(d); latar(() => kirimBatch([{ aksi: 'tambah', tabel: 'Revisi', data: Object.assign({}, dataRev, { dokumen_id: String(d._rid) }) }, { aksi: 'ubah', tabel: 'Dokumen', id: d._rid, data: dataDok }]), 'Simpan revisi'); }
    };
  }

  /* ---------- Dokumen baru: pilih cara ---------- */
  function pilih(hanyaSurat) {
    tutupDrawer();
    const tp = window.TEMPLAT.filter(t => (!hanyaSurat || t.surat) && bolehUbahKat(t.kat));
    const bsMasuk = bolehCatatMasuk() && !hanyaSurat;
    const back = drawer(`<h2>${hanyaSurat ? 'Buat surat keluar' : 'Dokumen baru'}</h2><p class="muted">Pilih cara mencatat dokumen.${tp.length < window.TEMPLAT.length ? ' Templat di luar kategori Anda disembunyikan.' : ''}</p>
      <div class="choice"><button type="button" data-c="templat" class="on"><b>Buat di web dari templat</b><span>Isi formulir singkat; sistem menyusun dokumen lengkap dengan kop surat, nomor manual sesuai buku agenda, dan tanda tangan. Siap dicetak atau disimpan PDF.</span></button>
      <button type="button" data-c="unggah"><b>Unggah berkas</b><span>Dokumen sudah jadi (PDF hasil pindai atau dari aplikasi lain). Sistem memberi nomor register dan menyimpan berkasnya.</span></button>
      ${bsMasuk ? '<button type="button" data-c="masuk"><b>Catat surat masuk</b><span>Surat dari pihak lain: beri nomor agenda, unggah pindaian, lalu disposisikan.</span></button>' : ''}</div>
      <h3 style="margin-top:18px" id="tplH">Pilih templat</h3><ul class="list">${tp.map(t => `<li><span><b>${esc(t.nama)}</b> <span class="chip">${t.surat ? 'surat' : 'dokumen'}</span><br><span class="muted" style="font-size:.84rem">${esc(t.ket)}</span></span><button class="btn ghost" type="button" data-t="${t.id}">Gunakan</button></li>`).join('') || '<li class="muted">Tidak ada templat untuk kategori Anda.</li>'}</ul>`);
    back.addEventListener('click', (e) => {
      const c = e.target.closest('[data-c]'), t = e.target.closest('[data-t]');
      if (c && c.dataset.c === 'unggah') { tutupDrawer(); form(hanyaSurat); }
      else if (c && c.dataset.c === 'masuk') { if (!bolehCatatMasuk()) { toast('Hanya Admin, Sekretariat, atau Ketua yang dapat mencatat surat masuk'); return; } formMasuk(); }
      else if (c) back.querySelector('#tplH').scrollIntoView({ behavior: 'smooth' });
      else if (t) { const tm = window.TEMPLAT.find(x => x.id === t.dataset.t); if (!bolehUbahKat(tm.kat)) { toast('Templat ini di luar kategori Anda'); return; } tutupDrawer(); window.bukaTemplat(t.dataset.t, API); }
    });
  }

  /* Jembatan untuk editor templat (templat.js + templatkustom.js) */
  const API = {
    hariIni: HARI_INI, KAT, JENIS, jenisArti,
    _api: api, _catat: catat,
    saranSurat(kode, t) { return saranSurat(kode, t); },
    nomorSurat(kode, t) { return saranSurat(kode, t); },
    nomorTerakhir(n) { return DOCS.filter(d => d.surat).map(d => d.kode).sort((a, b) => b.localeCompare(a)).slice(0, n || 5); },
    nomorDipakai(no) { return nomorDipakai(no); },
    simpan(o) {
      const katTujuan = o.kat || (o.id && (cariDok(o.id) || {}).kat);
      if (katTujuan && !bolehUbahKat(katTujuan)) { toast('Kategori ' + katTujuan + ' di luar wewenang peran Anda'); return; }
      const stt = o.surat ? (o.alur === 'Disahkan' ? 'Berlaku' : 'Draf') : (o.alur === 'Berlaku' ? 'Berlaku' : 'Draf');
      (async () => {
      let d;
      try {
        if (o.id) {
          d = cariDok(o.id);
          Object.assign(d, { judul: o.judul, kat: o.kat, tpl: o.tpl, terbit: o.tanggal, status: stt }); if (d.surat) d.alur = o.alur === 'Diajukan' ? 'Diajukan' : 'Draf';
          catat((d.alur === 'Diajukan' ? 'Mengajukan pengesahan ' : 'Memperbarui draf ') + d.kode);
          if (d._rid || d._siap) latar(() => api('ubah', { tabel: 'Dokumen', id: d._rid, data: dokKeServer(d) }), 'Simpan dokumen');
        } else {
          const m = String(o.nomor || '').match(/^(\d+)/); if (m) seq.SURAT = Math.max(seq.SURAT || 0, +m[1]);
          d = { id: DOCS.length + 1, kode: o.nomor, kat: o.kat, judul: o.judul, pemilik: (typeof bagianSaya === 'function' && bagianSaya()) || 'Sekretariat', terbit: o.tanggal || HARI_INI, sampai: '', status: stt, rev: 1, berkas: o.judul.replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf', tpl: o.tpl };
          if (o.surat) { d.surat = true; d.alur = o.alur; }
          DOCS.push(d); catat('Membuat ' + o.jenis.toLowerCase() + ' ' + d.kode + ' dari templat');
          d._siap = true; latar(() => api('tambah', { tabel: 'Dokumen', data: dokKeServer(d) }).then(b => { if (b && b.id) { d._lokal = d.id; d._rid = b.id; d.id = b.id; } }), 'Simpan dokumen');
        }
      } catch (err) { toast(err.message); return; }
      toast((d.surat ? (d.alur === 'Diajukan' ? 'Diajukan ke Ketua: ' : 'Draf tersimpan: ') : (stt === 'Berlaku' ? 'Diarsipkan: ' : 'Draf tersimpan: ')) + d.kode);
      if (d.surat) pergi('keluar'); else pergi('dokumen', d.kat);
      detail(d.id);
      })();
    }
  };

  /* ---------- Unggah berkas (nomor manual + simpan ke Drive) ---------- */
  // bacaBerkas: file input -> {nama, mime, base64} (base64 untuk dikirim ke backend unggahBerkas).
  const bacaBerkas = (inp) => new Promise((res, rej) => {
    const fl = inp.files && inp.files[0];
    if (!fl) return res(null);
    if (fl.size > 10 * 1024 * 1024) return rej(new Error('Berkas lebih dari 10 MB — unggah manual ke Drive lalu tempel link via Ubah data.'));
    const r = new FileReader();
    r.onload = () => res({ nama: fl.name, mime: fl.type || 'application/octet-stream', base64: String(r.result) });
    r.onerror = () => rej(new Error('Gagal membaca berkas.'));
    r.readAsDataURL(fl);
  });
  function form(surat) {
    const katBoleh = KAT.filter(k => bolehUbahKat(k[0]));
    if (!katBoleh.length) { toast('Tidak ada kategori yang dapat Anda ubah'); return; }
    const back = drawer(`<h2>Unggah berkas</h2><p class="muted" style="margin-top:-6px">Nomor <b>diketik manual sesuai buku agenda</b> (lihat tab Pedoman penomoran). Berkas disimpan ke folder Drive LSP.</p>
      <form class="form" id="fD">${surat ? '' : `<label class="f">Jenis<select name="jenis"><option value="dok">Dokumen (nomor manual buku agenda)</option><option value="surat">Surat keluar (nomor dari buku agenda)</option></select></label>`}
      <label class="f">Kategori arsip<select name="kat">${katBoleh.map(k => `<option value="${k[0]}"${surat && k[0] === 'KOR' ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Judul / perihal<input name="judul" required placeholder="mis. Berita Acara Asesmen Skema Web Developer"></label>
      <label class="f">Kode jenis<select name="kj">${JENIS.map(j => `<option value="${j[0]}"${j[0] === 'PB' ? ' selected' : ''}>${j[0]} — ${esc(j[1])}</option>`).join('')}</select><small class="muted" style="font-weight:400">mis. UND undangan, ST surat tugas, SK keputusan, PB pemberitahuan. Daftar lengkap di tab Pedoman penomoran.</small></label>
      <label class="f">Nomor dokumen (ketik manual)<input name="nomor" required placeholder="mis. 075/LSP-UNIMED/UND/X/2026"><small class="muted" style="font-weight:400" id="saranNo"></small></label>
      <div class="row2"><label class="f">Tanggal<input type="date" name="terbit" value="${HARI_INI}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai"></label></div>
      <div class="row2"><label class="f">Penanggung jawab<select name="pemilik"><option>Sekretariat</option><option>Administrasi</option><option>Sertifikasi</option><option>Manajemen Mutu</option><option>Skema</option></select></label><label class="f">Status<select name="status"><option>Berlaku</option><option>Draf</option></select></label></div>
      <label class="f">Berkas (PDF, DOCX, XLSX, JPG — maks 10 MB)<input type="file" name="berkas" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label>
      <label class="f">atau tautan Drive (opsional, bila berkas > 10 MB)<input name="tautan" placeholder="https://drive.google.com/..."></label>
      <p class="note" id="noPrev"></p><div><button class="btn" type="submit" id="btnSimpanDok">Simpan dokumen</button></div></form>`);
    const f = back.querySelector('#fD');
    const saranNo = () => saranSurat((f.kj.value || 'PB').toUpperCase().replace(/[^A-Z]/g, ''), f.terbit.value || HARI_INI);
    const prev = () => {
      if (!f.nomor.value) f.nomor.value = saranNo();
      back.querySelector('#saranNo').textContent = 'Saran urutan berikutnya: ' + saranNo() + ' — boleh diketik ulang sesuai buku agenda.';
      back.querySelector('#noPrev').textContent = nomorDipakai(f.nomor.value.trim()) ? 'Nomor ini sudah dipakai — ganti dengan urutan lain.' : '';
    };
    f.kj.addEventListener('change', () => { f.nomor.value = saranNo(); prev(); });
    f.terbit.addEventListener('change', () => { f.nomor.value = saranNo(); prev(); });
    f.nomor.addEventListener('input', prev); prev();
    f.onsubmit = async (e) => {
      e.preventDefault(); const k = f.kat.value, no = f.nomor.value.trim(), sr = surat || (f.jenis && f.jenis.value === 'surat');
      if (!bolehUbahKat(k)) { toast('Kategori ' + k + ' di luar wewenang peran Anda'); return; }
      if (!no) { toast('Isi nomor dokumen dulu (lihat Pedoman penomoran)'); return; }
      if (nomorDipakai(no)) { toast('Nomor ' + no + ' sudah dipakai. Ganti dengan nomor lain.'); return; }
      if (sr) seq.SURAT++; else seq[k] = (seq[k] || 0) + 1;
      const btn = back.querySelector('#btnSimpanDok'); btn.disabled = true; btn.textContent = 'Menyimpan…';
      let file_id = '', file_nama = '', file_url = (f.tautan.value || '').trim();
      try {
        const fl = await bacaBerkas(f.berkas);
        if (fl) {
          try {
            const up = await api('unggahBerkas', { data: { nama: fl.nama, mime: fl.mime, base64: fl.base64, kat: k } });
            file_id = up.file_id || ''; file_nama = up.file_nama || fl.nama; file_url = up.file_url || '';
          } catch (err) { toast(err.message + ' Dokumen tetap dicatat tanpa tautan berkas.'); file_nama = fl.nama; }
        }
      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Simpan dokumen'; return; }
      const d = { id: DOCS.length + 1, kode: no, kat: k, judul: f.judul.value.trim(), pemilik: f.pemilik.value, terbit: f.terbit.value, sampai: f.sampai.value, status: f.status.value, rev: 1, berkas: file_nama || 'berkas_baru.pdf', file_id, file_url };
      if (sr) { d.surat = true; d.alur = f.status.value === 'Berlaku' ? 'Disahkan' : 'Draf'; }
      DOCS.push(d); catat('Mengunggah ' + d.judul);
      tutupDrawer(); toast('Dokumen tersimpan: ' + d.kode + (file_url ? ' (berkas di Drive)' : '')); if (sr) pergi('keluar'); else pergi('dokumen', k);
      d._siap = true; latar(() => api('tambah', { tabel: 'Dokumen', data: dokKeServer(d) }).then(b => { if (b && b.id) { d._lokal = d.id; d._rid = b.id; d.id = b.id; } }), 'Simpan dokumen');
    };
  }

  login();
})();
</script>
</body>
</html>
